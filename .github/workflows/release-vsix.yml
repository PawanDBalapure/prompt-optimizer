name: Release VSIX (multi-platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Marketplace (requires VSCE_PAT secret)'
        required: false
        default: 'false'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: win32-arm64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: linux-armhf
            os: ubuntu-latest
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build .vsix for ${{ matrix.target }}
        run: node scripts/package-targets.cjs ${{ matrix.target }}
        working-directory: vscode-extension

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-extension/dist/${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish each .vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -e
          for vsix in artifacts/vsix-*/*.vsix; do
            echo "Publishing $vsix"
            vsce publish --packagePath "$vsix" --pat "$VSCE_PAT"
          done

      - name: Attach .vsix files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/vsix-*/*.vsix
